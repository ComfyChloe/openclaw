name: Temporary Android catalog APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-catalog-apk-575c21f7
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'openclaw/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_COMMIT: 575c21f72a45fe6b62c3bf4d8871bfefb772479e
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
    steps:
      - name: Checkout exact Android candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 575c21f72a45fe6b62c3bf4d8871bfefb772479e
          persist-credentials: false
      - name: Check candidate source and record hosted resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e .env.local
          free -b
          df -B1 "$GITHUB_WORKSPACE"
          nproc
      - name: Setup pinned Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: restore
          install-screenshot-emulators: "false"
      - name: Setup Node environment for native resources
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
      - name: Build Play debug APK
        working-directory: apps/android
        shell: bash
        run: ./gradlew --no-daemon --build-cache :app:assemblePlayDebug
      - name: Verify and prepare exact APK export
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          output=apps/android/app/build/outputs/apk/play/debug
          metadata="$output/output-metadata.json"
          apk_name=$(jq -er 'select(.applicationId == "ai.openclaw.app.debug" and .variantName == "playDebug") | .elements | select(length == 1) | .[0].outputFile' "$metadata")
          [[ "$apk_name" == *.apk && "$apk_name" != */* ]]
          export_dir="$RUNNER_TEMP/android-catalog-apk"
          mkdir "$export_dir"
          cp "$output/$apk_name" "$export_dir/candidate.apk"
          cp "$metadata" "$export_dir/output-metadata.json"
          test -s "$export_dir/candidate.apk"
          build_config=apps/android/app/build/generated/source/buildConfig/play/debug/ai/openclaw/app/BuildConfig.java
          test -s "$build_config"
          grep -F "public static final String GIT_COMMIT = \"$SOURCE_COMMIT\";" "$build_config"
          cp "$build_config" "$export_dir/BuildConfig.java"
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$export_dir/candidate.apk" | tee "$export_dir/signing.txt"
          "$tools/aapt2" dump badging "$export_dir/candidate.apk" | tee "$export_dir/package.txt"
          grep -F "package: name='ai.openclaw.app.debug' " "$export_dir/package.txt"
          grep -Fx "minSdkVersion:'31'" "$export_dir/package.txt"
          grep -Fx "targetSdkVersion:'36'" "$export_dir/package.txt"
          jq -n \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg workflowCommit "$WORKFLOW_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg originalApk "$apk_name" \
            '{sourceCommit:$sourceCommit,workflowCommit:$workflowCommit,runId:$runId,runAttempt:$runAttempt,variant:"playDebug",apk:"candidate.apk",originalApk:$originalApk}' > "$export_dir/build.json"
          (
            cd "$export_dir"
            sha256sum candidate.apk output-metadata.json BuildConfig.java signing.txt package.txt build.json > SHA256SUMS
          )
      - name: Upload exact APK and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-catalog-play-debug-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-catalog-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
