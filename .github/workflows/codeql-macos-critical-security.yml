name: Blacksmith macOS Assignment Canary (never merge)

on:
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    name: Blacksmith macOS assignment canary
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 1
    steps:
      - name: Report runner capacity
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"

          xcode_version="$(/usr/bin/xcodebuild -version)"
          case "$xcode_version" in
            "Xcode 26.6"*) ;;
            *)
              echo "error: expected Xcode 26.6" >&2
              exit 1
              ;;
          esac

          printf 'architecture=%s\n' "$(/usr/bin/uname -m)"
          printf 'macos=%s\n' "$(/usr/bin/sw_vers -productVersion)"
          printf 'logical_cpus=%s\n' "$(/usr/sbin/sysctl -n hw.logicalcpu)"
          printf 'memory_bytes=%s\n' "$(/usr/sbin/sysctl -n hw.memsize)"
          printf '%s\n' "$xcode_version"
          /usr/bin/xcrun swift --version
